<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Heart — เข้าสู่ระบบ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mitr:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink-bg-1: #FFE3EC;
    --pink-bg-2: #FDD0DE;
    --house-wall: #FFF7F1;
    --house-roof: #E8886F;
    --house-roof-dark: #D8735C;
    --rose-deep: #C6607A;
    --rose-mid: #E68FA3;
    --rose-soft: #FBD9E1;
    --plum-text: #5B3A4B;
    --plum-soft: #8A6373;
    --field-bg: #FFF0F4;
    --field-border: #F7C3D2;
    --white: #FFFFFF;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 15% 10%, #fff 0%, transparent 3%),
      radial-gradient(circle at 85% 8%, #fff 0%, transparent 2.4%),
      radial-gradient(circle at 75% 92%, #fff 0%, transparent 2.8%),
      radial-gradient(circle at 8% 88%, #fff 0%, transparent 2%),
      linear-gradient(160deg, var(--pink-bg-1) 0%, var(--pink-bg-2) 100%);
    font-family: 'Mitr', sans-serif;
    color: var(--plum-text);
    padding: 32px 16px;
  }

  .app-frame{
    width: 100%;
    max-width: 400px;
    background: linear-gradient(180deg, #FFEAF1 0%, #FFDFEC 60%, #FCD3E1 100%);
    border-radius: 40px;
    padding: 28px 26px 34px;
    box-shadow:
      0 30px 60px -20px rgba(198, 96, 122, 0.35),
      0 0 0 1px rgba(255,255,255,0.6) inset;
    position: relative;
    overflow: hidden;
  }

  .app-frame::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:160px; height:160px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,255,255,0.55), transparent 70%);
  }

  .brand{
    text-align:center;
    margin-bottom: 6px;
  }

  .brand-name{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 1.05rem;
    letter-spacing: 0.03em;
    color: var(--rose-deep);
  }

  .brand-name .heart{
    color: var(--house-roof-dark);
  }

  .logo-wrap{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin: 14px 0 18px;
  }

  .logo-title{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size: 2rem;
    color: var(--rose-deep);
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
    margin-top: 10px;
  }

  .logo-sub{
    font-size: 0.78rem;
    color: var(--plum-soft);
    margin-top: 2px;
    font-weight: 300;
  }

  .house-illustration{
    width: 190px;
    height: auto;
    filter: drop-shadow(0 10px 16px rgba(198,96,122,0.28));
  }

  form{
    display:flex;
    flex-direction:column;
    gap: 12px;
    margin-top: 6px;
  }

  .field{
    position:relative;
  }

  .field input{
    width:100%;
    padding: 14px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--field-border);
    background: var(--field-bg);
    font-family:'Mitr', sans-serif;
    font-size: 0.92rem;
    color: var(--plum-text);
    outline:none;
    transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
  }

  .field input::placeholder{
    color: #C98CA0;
    font-weight: 300;
  }

  .field input:focus{
    border-color: var(--rose-mid);
    background: var(--white);
    box-shadow: 0 0 0 4px rgba(230,143,163,0.18);
  }

  .field-error{
    display:block;
    font-size: 0.72rem;
    color: #C0405F;
    padding: 3px 18px 0;
    min-height: 14px;
  }

  .toggle-pw{
    position:absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    background:none;
    border:none;
    cursor:pointer;
    padding: 4px;
    color: var(--plum-soft);
    display:flex;
    align-items:center;
  }

  .toggle-pw svg{ width:18px; height:18px; }

  .row-between{
    display:flex;
    justify-content:flex-end;
    padding: 0 16px;
    margin-top: -4px;
  }

  .link-btn{
    background:none;
    border:none;
    font-family:'Mitr', sans-serif;
    font-size: 0.76rem;
    color: var(--rose-deep);
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .btn-primary{
    margin-top: 10px;
    width:100%;
    padding: 15px;
    border-radius: 999px;
    border:none;
    background: linear-gradient(135deg, var(--rose-mid), var(--rose-deep));
    color: var(--white);
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 1rem;
    letter-spacing: 0.02em;
    cursor:pointer;
    box-shadow: 0 10px 20px -6px rgba(198,96,122,0.55);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .btn-primary:hover{ filter: brightness(1.04); }
  .btn-primary:active{ transform: translateY(1px) scale(0.99); }

  .btn-primary[disabled]{
    opacity: 0.65;
    cursor:default;
    filter:none;
    transform:none;
  }

  .spinner{
    width:16px; height:16px;
    border-radius:50%;
    border: 2.5px solid rgba(255,255,255,0.5);
    border-top-color: #fff;
    animation: spin .7s linear infinite;
    display:none;
  }

  .btn-primary.loading .spinner{ display:inline-block; }
  .btn-primary.loading .btn-label{ opacity: 0.85; }

  @keyframes spin{ to{ transform: rotate(360deg); } }

  .btn-secondary{
    width:100%;
    padding: 13px;
    margin-top: 4px;
    border-radius: 999px;
    border: 1.5px solid var(--rose-deep);
    background: transparent;
    color: var(--rose-deep);
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size: 0.92rem;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }

  .btn-secondary:hover{
    background: var(--rose-deep);
    color: var(--white);
  }

  .mock-badge{
    text-align:center;
    font-size: 0.72rem;
    color: #8A6373;
    background: rgba(255,255,255,0.65);
    border: 1px dashed rgba(198,96,122,0.5);
    border-radius: 999px;
    padding: 6px 12px;
    margin-bottom: 10px;
  }

  .btn-ghost{
    width:100%;
    padding: 11px;
    margin-top: 8px;
    border-radius: 999px;
    border: none;
    background: transparent;
    color: var(--plum-soft);
    font-family:'Mitr', sans-serif;
    font-size: 0.8rem;
    cursor:pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .status-msg{
    text-align:center;
    font-size: 0.78rem;
    min-height: 18px;
    margin-top: 10px;
    color: #C0405F;
  }

  .status-msg.success{ color: #3E8E6E; }

  .divider{
    display:flex;
    align-items:center;
    gap:10px;
    margin: 16px 0 4px;
    color: var(--plum-soft);
    font-size: 0.7rem;
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background: rgba(198,96,122,0.25);
  }

  @media (max-width: 340px){
    .logo-title{ font-size: 1.7rem; }
    .house-illustration{ width: 160px; }
  }

  .sr-only{
    position:absolute; width:1px; height:1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap;
  }

  input:focus-visible, button:focus-visible{
    outline: 2.5px solid var(--rose-deep);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce){
    .spinner{ animation: none; }
    *{ transition: none !important; }
  }
</style>
</head>
<body>

<main class="app-frame">
  <div class="brand">
    <span class="brand-name">Family <span class="heart">Heart</span></span>
  </div>

  <div class="logo-wrap">
    <!-- House + family illustration -->
    <svg class="house-illustration" viewBox="0 0 220 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="โลโก้บ้านครอบครัว Family Heart">
      <!-- roof -->
      <path d="M20 92 L110 22 L200 92 L184 92 L184 100 L36 100 L36 92 Z" fill="#E8886F"/>
      <path d="M20 92 L110 22 L200 92 L188 92 L110 34 L32 92 Z" fill="#D8735C"/>
      <!-- little heart on roof -->
      <path d="M110 44 c-3-6-12-6-13 1 c-1 6 6 10 13 15 c7-5 14-9 13-15 c-1-7-10-7-13-1Z" fill="#FFD9E4"/>
      <!-- walls -->
      <rect x="36" y="98" width="148" height="80" rx="10" fill="#FFF7F1"/>
      <!-- windows -->
      <rect x="46" y="112" width="26" height="26" rx="6" fill="#FBD9E1"/>
      <rect x="148" y="112" width="26" height="26" rx="6" fill="#FBD9E1"/>
      <!-- door / floor area implied, family sits on porch step -->
      <rect x="36" y="168" width="148" height="10" rx="4" fill="#F3C6D3"/>

      <!-- Dad -->
      <g transform="translate(64,120)">
        <circle cx="0" cy="0" r="12" fill="#F6C9A0"/>
        <path d="M-12 -2 a12 10 0 0 1 24 0 l-2 -1 a11 8 0 0 0 -20 0Z" fill="#6B4A3A"/>
        <rect x="-13" y="10" width="26" height="30" rx="10" fill="#7F9CC9"/>
      </g>

      <!-- Mom -->
      <g transform="translate(110,116)">
        <circle cx="0" cy="0" r="13" fill="#F8D3AE"/>
        <path d="M-14 4 q14 14 28 0 l0 -8 a14 12 0 0 0 -28 0Z" fill="#7A4B3C"/>
        <rect x="-14" y="12" width="28" height="32" rx="12" fill="#E68FA3"/>
      </g>

      <!-- Kid -->
      <g transform="translate(150,128)">
        <circle cx="0" cy="0" r="9" fill="#F8D3AE"/>
        <path d="M-9 -1 a9 7 0 0 1 18 0 l-1 -1 a8 6 0 0 0 -16 0Z" fill="#4F3527"/>
        <rect x="-9" y="7" width="18" height="20" rx="8" fill="#F4B942"/>
      </g>
    </svg>

    <p class="logo-title">Family Heart</p>
    <p class="logo-sub">เชื่อมหัวใจ เข้าใจกันมากขึ้น</p>
  </div>

  <form id="login-form" novalidate>
    <p class="mock-badge" id="mock-badge" hidden>โหมดทดลอง — ยังไม่ต่อ Firebase จริง ข้อมูลอยู่แค่ในเครื่องนี้</p>
    <div class="field">
      <label for="identifier" class="sr-only">อีเมล หรือ เบอร์โทร</label>
      <input type="text" id="identifier" name="identifier" placeholder="อีเมล / เบอร์โทร" autocomplete="username" required>
      <span class="field-error" id="identifier-error"></span>
    </div>

    <div class="field">
      <label for="password" class="sr-only">รหัสผ่าน</label>
      <input type="password" id="password" name="password" placeholder="รหัสผ่าน" autocomplete="current-password" required minlength="6">
      <button type="button" class="toggle-pw" id="toggle-pw" aria-label="แสดงรหัสผ่าน" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <span class="field-error" id="password-error"></span>
    </div>

    <div class="row-between">
      <button type="button" class="link-btn" id="forgot-btn">ลืมรหัสผ่าน?</button>
    </div>

    <button type="submit" class="btn-primary" id="login-btn">
      <span class="spinner" aria-hidden="true"></span>
      <span class="btn-label">เข้าสู่ระบบ</span>
    </button>

    <p class="status-msg" id="status-msg" role="status" aria-live="polite"></p>

    <div class="divider">หรือ</div>

    <button type="button" class="btn-secondary" id="signup-btn">สมัครสมาชิก</button>
    <button type="button" class="btn-ghost" id="guest-btn">ทดลองโดยไม่สมัคร (Guest)</button>
  </form>
</main>

<script type="module" src="firebase-config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
